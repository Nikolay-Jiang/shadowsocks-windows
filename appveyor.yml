version: 4.5.0.{build}

image: Visual Studio 2022
clone_depth: 5

environment:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

build_script:
  - dotnet --info
  - dotnet restore shadowsocks-windows.sln
  - dotnet build shadowsocks-windows.sln -c Release --no-restore
  - dotnet test shadowsocks-windows.sln -c Release --no-build
  - dotnet publish shadowsocks-csharp/shadowsocks-csharp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish

after_build:
  - ps: Remove-Item publish\*.pdb -ErrorAction SilentlyContinue
  - ps: Compress-Archive -Path publish\Shadowsocks.exe -DestinationPath "Shadowsocks-$env:APPVEYOR_BUILD_VERSION.zip"

artifacts:
  - path: '*.zip'
    name: Shadowsocks
