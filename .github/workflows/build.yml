name: build

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: dotnet test Shadowsocks.Core.Tests/Shadowsocks.Core.Tests.csproj -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore shadowsocks-windows.sln
      - name: Build
        run: dotnet build shadowsocks-windows.sln -c Release --no-restore
      - name: Test
        run: dotnet test shadowsocks-windows.sln -c Release --no-build
      - name: Publish
        run: dotnet publish shadowsocks-csharp/shadowsocks-csharp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Remove symbols from artifact
        shell: pwsh
        run: Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shadowsocks-win-x64
          path: publish/
